cvm-version: 0.10.4
cpus: 32
memory: 524288
gpus: 1

networks:
  guards: {}
  nvidia:
    egress: allowlist
    allow:
      - edge.urm.nvidia.com

models:
  - name: "lyraixguard"
    repo: "Lyraix-AI/LyraixGuard-v0@811dcadf492ab80ba6f7b41284e9a3674caade6b"
    mpk: "99b08cf757dbc6705dc1221510d25f6dfdbdaf51b801093bd937d2bc0d394f31_8056471552_3cc6b135-1c38-5978-a04a-fce61734a6bf"
  - name: "aprielguard"
    repo: "ServiceNow-AI/AprielGuard@e7e936d158cf054e9f078580e432a477bfdd5436"
    mpk: "4e1e2ee066a2fa44731bd770524f3a9d5b2078a183f00f43281d95028dcd18bb_15789445120_73ef2f79-2f4d-5add-8916-cb8e7de086fa"
  - name: "qwen3guard-stream"
    repo: "Qwen/Qwen3Guard-Stream-8B@f14fba01154127167c77c0e9f80536cec56e7b69"
    mpk: "c2a73efbc772c53cda3c83277f4d3850843f7d9abe6bbebc80ccde681867319b_15161868288_a4146969-0622-57fc-9671-e986ae8a3cf3"

containers:
  - name: "router"
    image: "ghcr.io/tinfoilsh/confidential-gpu-safeguards@sha256:3d610c9363a5f9096bf91cfbfca24d1f825d300e961a9298c3962ba1b52a5656" # v0.0.5
    restart: always
    env:
      - LISTEN_ADDR: ":8080"
      - LYRAIXGUARD_URL: "http://lyraixguard:8001"
      - APRIELGUARD_URL: "http://aprielguard:8002"
      - QWEN3GUARD_URL: "http://qwen3guard:8003"
    networks: ["guards"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 1m

  - name: "lyraixguard"
    image: "vllm/vllm-openai:v0.25.1@sha256:f0b9a0dc75a9fca3b6811e3279367b2d6a448055a000bfd13859587d74cef268"
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # v0.23 corrupts output on B300 regardless of attention backend; v0.25.1
      # V1 runner + TRITON_ATTN is the org-validated combination (see gemma4).
      - VLLM_USE_V2_MODEL_RUNNER: "0"
    entrypoint: ["vllm", "serve"]
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-99b08cf757dbc6705dc1221510d25f6dfdbdaf51b801093bd937d2bc0d394f31",
        "--served-model-name",
        "lyraixguard",
        "--attention-backend",
        "TRITON_ATTN",
        "--gpu-memory-utilization",
        "0.30",
        "--max-model-len",
        "32768",
        "--max-num-seqs",
        "16",
        "--scheduling-policy",
        "priority",
        "--port",
        "8001",
        "--host",
        "0.0.0.0",
      ]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=2g,mode=0700,exec
      /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins: size=2g,mode=1777,exec
    networks: ["guards", "nvidia"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10m

  - name: "aprielguard"
    image: "vllm/vllm-openai:v0.25.1@sha256:f0b9a0dc75a9fca3b6811e3279367b2d6a448055a000bfd13859587d74cef268"
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # v0.23 corrupts output on B300 regardless of attention backend; v0.25.1
      # V1 runner + TRITON_ATTN is the org-validated combination (see gemma4).
      - VLLM_USE_V2_MODEL_RUNNER: "0"
    entrypoint: ["vllm", "serve"]
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-4e1e2ee066a2fa44731bd770524f3a9d5b2078a183f00f43281d95028dcd18bb",
        "--served-model-name",
        "aprielguard",
        "--attention-backend",
        "TRITON_ATTN",
        "--gpu-memory-utilization",
        "0.40",
        "--max-model-len",
        "32768",
        "--max-num-seqs",
        "16",
        "--scheduling-policy",
        "priority",
        "--port",
        "8002",
        "--host",
        "0.0.0.0",
      ]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=2g,mode=0700,exec
      /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins: size=2g,mode=1777,exec
    networks: ["guards", "nvidia"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      start_period: 10m

  - name: "qwen3guard"
    image: "ghcr.io/tinfoilsh/confidential-gpu-safeguards-guard@sha256:096c1faed2a4109ecb3cfd649f807218d524686b6b8a62e33339afef5f6cd114" # v0.0.5
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - MODEL_PATH: "/tinfoil/mpk/mpk-c2a73efbc772c53cda3c83277f4d3850843f7d9abe6bbebc80ccde681867319b"
      - HF_HUB_OFFLINE: "1"
      - TRANSFORMERS_OFFLINE: "1"
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8003"]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=2g,mode=0700,exec
    networks: ["guards"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      start_period: 5m

shim:
  upstream-port: 8080
  authenticated: true
  authenticated-endpoints:
    - /lyraixguard/v1/chat/completions
    - /aprielguard/v1/chat/completions
    - /qwen3guard/moderate
  paths:
    - /health
    - /models
    - /lyraixguard/v1/chat/completions
    - /aprielguard/v1/chat/completions
    - /qwen3guard/moderate
